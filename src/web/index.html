/* ----- Assistant ----- */
const QUESTIONS = [["stethoscope", "Pourquoi ce moteur est-il dans cet état ?"], ["activity", "Quels capteurs montrent la dégradation ?"], ["wrench", "Que recommandes-tu comme action de maintenance ?"], ["alarm-clock", "L'intervention est-elle urgente ?"]];
const MODE = { llm: ["Réponse LLM", "llm", "sparkles"], extractif: ["Réponse extractive", "extractif", "file-text"], extractif_secours: ["Secours extractif", "secours", "life-buoy"], refus: ["Question refusée", "refus", "ban"] };
const CLE_CONV = "turbowatch-conversations";
function chargerConvs() {
  try { etat.convs = JSON.parse(localStorage.getItem(CLE_CONV) || "[]").filter((c) => c && Array.isArray(c.messages)); } catch { etat.convs = []; }
}
function sauverConvs() {
  try { localStorage.setItem(CLE_CONV, JSON.stringify(etat.convs.slice(0, 30).map((c) => ({ ...c, messages: c.messages.filter((m) => !m.attente) })))); } catch { /* stockage indisponible */ }
}
const convActive = () => etat.convs.find((c) => c.id === etat.convActive);
const enCours = () => etat.convs.some((c) => c.messages.some((m) => m.attente));
function nouvelleConv(moteur) {
  const vide0 = etat.convs.find((c) => c.moteur === moteur && !c.messages.length);
  if (vide0) { etat.convActive = vide0.id; return vide0; }
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), moteur, titre: "Nouvelle conversation", date: new Date().toISOString(), messages: [] };
  etat.convs.unshift(c); etat.convActive = c.id; sauverConvs(); return c;
}
function ouvrirAssistant(moteur) {
  etat.moteur = moteur;
  const c = convActive();
  if (!c || c.moteur !== moteur || c.messages.length) nouvelleConv(moteur);
  location.hash = "#/assistant";
}
function formater(texte) {
  const lignes = esc(texte).split(/\n+/).map((l) => l.trim()).filter(Boolean);
  let html = "", liste = false;
  for (const l of lignes) {
    const item = /^[-*•]\s+|^\d+[.)]\s+/.test(l);
    if (item && !liste) { html += "<ul>"; liste = true; }
    if (!item && liste) { html += "</ul>"; liste = false; }
    const c = l.replace(/^[-*•]\s+|^\d+[.)]\s+/, "").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, '<span class="cite">$1</span>');
    html += item ? `<li>${c}</li>` : `<p>${c}</p>`;
  }
  return html + (liste ? "</ul>" : "");
}
function rendreMessage(m) {
  const q = `<div class="msg-q"><small>Moteur ${m.moteur}</small>${esc(m.q)}</div>`;
  const av = `<div class="avatar"><i data-lucide="bot"></i></div>`;
  if (m.attente) return `${q}<div class="msg-r">${av}<div class="bulle"><div class="chargement"><span class="ecriture"><i></i><i></i><i></i></span><span>L'assistant analyse le moteur et la documentation NASA<span class="num" data-chrono="${m.debut}"></span></span></div></div></div>`;
  if (m.erreur) return `${q}<div class="msg-r">${av}<div class="bulle">${erreurBox(m.erreur)}</div></div>`;
  const d = m.r, [lib, cls, ic] = MODE[d.mode] || [d.mode, "", "info"];
  const meta = `<div class="meta"><span class="tag ${cls}"><i data-lucide="${ic}"></i>${lib}</span><span class="tag"><i data-lucide="timer"></i>${nf((d.latence_ms || 0) / 1000)} s</span>
    <span class="tag"><i data-lucide="coins"></i>${(d.tokens_entree || 0) + (d.tokens_sortie || 0)} tokens, ${Number(d.cout_estime_usd || 0).toFixed(5)} $</span>
    ${(d.garde_fous || []).map((g) => `<span class="tag"><i data-lucide="shield-check"></i>Garde-fou : ${esc(g)}</span>`).join("")}</div>`;
  if (d.refus) return `${q}<div class="msg-r">${av}<div class="bulle"><p>${esc(d.reponse)}</p>${meta}</div></div>`;
  const texte = d.reponse.replace(/^RUL predite par le modele\s*:[^()]*\(statut [A-Z]+\)\.\s*/i, "");
  return `${q}<div class="msg-r">${av}<div class="bulle">
    <div class="diag-r">${badge(d.statut)}<span class="kv">RUL prédite <b>${nf(d.rul_predite)}</b> cycles</span><span class="kv">Niveau de risque <b style="color:${COUL[d.statut]}">${RISQUE[d.statut]}</b></span></div>
    <div class="sec-r" style="margin-top:0"><h4><i data-lucide="message-square-text"></i>Diagnostic de l'assistant</h4>${formater(texte) || '<p>Aucun texte retourné.</p>'}</div>
    ${d.capteurs_anormaux?.length ? `<div class="sec-r"><h4><i data-lucide="activity"></i>Capteurs concernés</h4><div class="chips">${d.capteurs_anormaux.map((c) => `<span class="chip ${Math.abs(c.z_score) >= 2 ? "fort" : ""}"><b>${c.capteur}</b>${esc(c.symbole)}<span class="num">z ${c.z_score > 0 ? "+" : ""}${nf(c.z_score)}</span></span>`).join("")}</div></div>` : ""}
    <div class="sec-r"><h4><i data-lucide="lightbulb"></i>Recommandations (règles de maintenance)</h4><div class="recos">${recommandations({ statut: d.statut, rul_predite: d.rul_predite, capteurs_anormaux: d.capteurs_anormaux }).map(([icr, ton, t, txt]) => `<div style="--ton:${ton}"><i data-lucide="${icr}"></i><span><strong>${t}.</strong> ${txt}</span></div>`).join("")}</div></div>
    ${d.references?.length ? `<div class="sec-r"><h4><i data-lucide="library"></i>Sources documentaires</h4><ul class="refs" style="margin:0">${d.references.map((x) => `<li><i data-lucide="file-text"></i>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${meta}</div></div>`;
}
let chrono;
function majEnvoi() {
  const t = $("#chat-q"), env = $("#chat-envoi");
  if (!t || !env) return;
  env.disabled = t.value.trim().length < 3 || enCours();
  document.querySelectorAll("#sugg-ligne button, .sugg button").forEach((b) => { b.disabled = enCours(); });
}
function rendreChat() {
  const f = $("#chat-flux");
  if (!f) return;
  const c = convActive();
  const m = etat.flotte.find((x) => x.moteur === etat.moteur);
  f.innerHTML = c && c.messages.length ? c.messages.map(rendreMessage).join("") : `
    <div class="accueil"><div class="avatar"><i data-lucide="bot"></i></div>
      <h2>Comment puis-je vous aider sur le moteur ${etat.moteur} ?</h2>
      <p>${m ? `Statut prédit ${LIB_STATUT[m.statut_predit].toLowerCase()}, RUL prédite de ${nf(m.rul_predite)} cycles. ` : ""}Les réponses combinent la prédiction du modèle, les capteurs inhabituels et la documentation NASA.</p>
      <div class="sugg">${QUESTIONS.map(([ic, q]) => `<button data-q="${esc(q)}"><i data-lucide="${ic}"></i>${q}</button>`).join("")}</div></div>`;
  $("#sugg-ligne").hidden = !(c && c.messages.length);
  f.querySelectorAll("[data-q]").forEach((b) => b.addEventListener("click", () => demander(b.dataset.q)));
  icones();
  f.scrollTop = f.scrollHeight;
  clearInterval(chrono);
  const tic = () => f.querySelectorAll("[data-chrono]").forEach((s) => { s.textContent = ` (${Math.floor((Date.now() - +s.dataset.chrono) / 1000)} s)`; });
  if (f.querySelector("[data-chrono]")) { tic(); chrono = setInterval(tic, 500); }
  rendreHistorique();
  majEnvoi();
}
function rendreHistorique() {
  const h = $("#hist");
  if (!h) return;
  const visibles = etat.convs.filter((c) => c.messages.length || c.id === etat.convActive);
  h.innerHTML = visibles.length ? visibles.map((c) => `<div class="conv" role="button" tabindex="0" data-conv="${c.id}" aria-current="${c.id === etat.convActive}">
      <i data-lucide="message-square"></i><span style="min-width:0"><span class="t">${esc(c.titre)}</span><span class="m">Moteur ${c.moteur}, ${c.messages.filter((x) => x.r || x.erreur).length} réponse(s)</span></span>
      <button class="suppr" style="background:none;border:0;cursor:pointer" data-suppr="${c.id}" title="Supprimer" aria-label="Supprimer la conversation"><i data-lucide="trash-2"></i></button></div>`).join("")
    : '<p class="note" style="margin:0">Aucune conversation.</p>';
  icones();
}
async function demander(question) {
  const q = (question || "").trim();
  if (q.length < 3 || !etat.moteur || enCours()) return;
  let c = convActive();
  if (!c || c.moteur !== etat.moteur) c = nouvelleConv(etat.moteur);
  if (!c.messages.length) c.titre = q.length > 48 ? `${q.slice(0, 46)}…` : q;
  const msg = { q, moteur: etat.moteur, attente: true, debut: Date.now() };
  c.messages.push(msg); c.date = new Date().toISOString(); rendreChat();
  try {
    const d = await detail(msg.moteur);
    msg.r = await api("/assistant", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q, capteurs: d.capteurs }) });
  } catch (e) { msg.erreur = e.status === 422 ? "La question doit contenir entre 3 et 500 caractères." : e.message; }
  msg.attente = false; delete msg.debut; sauverConvs(); rendreChat();
}
function pageAssistant(el) {
  const ids = etat.flotte.map((m) => m.moteur);
  etat.moteurChoisi = !!etat.moteur;
  if (!etat.moteur) etat.moteur = plusFaible();
  let c = convActive();
  if (!c) c = (!etat.moteurChoisi && etat.convs[0]) || nouvelleConv(etat.moteur);
  etat.convActive = c.id;
  etat.moteur = c.moteur;
  const m = etat.flotte.find((x) => x.moteur === etat.moteur);
  const ancien = $("#chat-q")?.value || "";
  el.innerHTML = `<div class="ia">
    <aside class="ia-side">
      <section class="card">
        <div class="card-h" style="margin-bottom:.8rem"><i data-lucide="plane"></i><div class="titres"><h2>Moteur analysé</h2></div></div>
        <label class="sr" for="ia-m">Moteur analysé</label>
        <select class="champ" id="ia-m" style="width:100%">${ids.map((x) => `<option value="${x}" ${x === etat.moteur ? "selected" : ""}>Moteur ${x}</option>`).join("")}</select>
        ${m ? `<dl class="mini-moteur"><div><dt>RUL prédite</dt><dd style="color:${COUL[m.statut_predit]}">${nf(m.rul_predite)}</dd></div><div><dt>Statut</dt><dd style="font-family:var(--font);padding-top:.2rem">${badge(m.statut_predit)}</dd></div><div><dt>RUL réelle</dt><dd style="color:var(--violet)">${nf(m.rul_reelle)}</dd></div><div><dt>Cycles</dt><dd>${m.nb_cycles}</dd></div></dl>` : ""}
        <button class="btn" style="width:100%;margin-top:.8rem" id="ia-voir"><i data-lucide="gauge"></i>Voir la fiche du moteur</button>
      </section>
      <section class="card historique">
        <div class="card-h" style="margin-bottom:.8rem"><i data-lucide="history"></i><div class="titres"><h2>Historique</h2></div><div class="actions"><button class="btn sm" id="ia-nouv"><i data-lucide="plus"></i>Nouvelle</button></div></div>
        <div class="liste" id="hist"></div>
      </section>
    </aside>
    <section class="card chat" aria-label="Conversation">
      <div class="chat-h"><div class="avatar"><i data-lucide="bot"></i></div><div><strong style="font-size:1.08rem">Assistant de maintenance, moteur ${etat.moteur}</strong><div class="note" style="margin:0" id="ia-mode"></div></div>
        <div class="ctx">${m ? badge(m.statut_predit) : ""}<button class="btn sm" id="ia-vider"><i data-lucide="eraser"></i>Effacer</button></div></div>
      <div class="chat-flux" id="chat-flux" aria-live="polite"></div>
      <div class="sugg-ligne" id="sugg-ligne" hidden>${QUESTIONS.map(([, q]) => `<button data-q2="${esc(q)}">${q}</button>`).join("")}</div>
      <form class="chat-saisie" id="chat-form">
        <div class="saisie-boite"><label class="sr" for="chat-q">Votre question</label>
          <textarea id="chat-q" rows="1" maxlength="500" placeholder="Posez une question sur le moteur ${etat.moteur}..."></textarea>
          <button class="envoi" id="chat-envoi" type="submit" aria-label="Envoyer" disabled><i data-lucide="arrow-up"></i></button></div>
        <div class="saisie-pied"><span>Entrée pour envoyer, Maj + Entrée pour aller à la ligne</span><span class="num" id="chat-cpt">0 / 500</span></div>
      </form>
    </section></div>`;
  $("#ia-mode").textContent = etat.health?.assistant_mode === "llm" ? "LLM actif (Groq), réponses sourcées par la documentation NASA" : "Mode extractif : phrases de la documentation NASA, sans LLM";
  icones();
  const t = $("#chat-q");
  t.value = ancien;
  const ajuster = () => { t.style.height = "auto"; t.style.height = `${Math.min(t.scrollHeight, 160)}px`; $("#chat-cpt").textContent = `${t.value.length} / 500`; majEnvoi(); };
  rendreChat(); ajuster();
  t.addEventListener("input", ajuster);
  t.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chat-form").requestSubmit(); } });
  $("#chat-form").addEventListener("submit", (e) => { e.preventDefault(); if (t.value.trim().length >= 3 && !enCours()) { demander(t.value); t.value = ""; ajuster(); } });
  el.querySelectorAll("[data-q2]").forEach((b) => b.addEventListener("click", () => demander(b.dataset.q2)));
  $("#ia-m").addEventListener("change", (e) => { etat.moteur = +e.target.value; nouvelleConv(etat.moteur); pageAssistant(el); });
  $("#ia-voir").addEventListener("click", () => allerMoteur(etat.moteur));
  $("#ia-nouv").addEventListener("click", () => { nouvelleConv(etat.moteur); pageAssistant(el); });
  $("#ia-vider").addEventListener("click", () => { const cc = convActive(); if (cc && !enCours()) { cc.messages = []; cc.titre = "Nouvelle conversation"; sauverConvs(); rendreChat(); } });
  const hist = $("#hist");
  const ouvrir = (id) => { etat.convActive = id; etat.moteur = convActive().moteur; pageAssistant(el); };
  hist.addEventListener("click", (e) => {
    const s = e.target.closest("[data-suppr]");
    if (s) {
      e.stopPropagation();
      const cible = etat.convs.find((x) => x.id === s.dataset.suppr);
      if (cible?.messages.some((x) => x.attente)) return;
      etat.convs = etat.convs.filter((x) => x.id !== s.dataset.suppr);
      if (etat.convActive === s.dataset.suppr) etat.convActive = null;
      sauverConvs(); pageAssistant(el); return;
    }
    const b = e.target.closest("[data-conv]");
    if (b) ouvrir(b.dataset.conv);
  });
  hist.addEventListener("keydown", (e) => { const b = e.target.closest("[data-conv]"); if (b && e.key === "Enter" && e.target === b) ouvrir(b.dataset.conv); });
  if (window.innerWidth > 900) t.focus({ preventScroll: true });
}

/* ================= Menu lateral redimensionnable ================= */
const MENU = { min: 72, seuil: 170, max: 420, cle: "turbowatch-largeur-menu" };
let menuRaf;
function largeurMenu(px, sauver = false) {
  const racine = document.documentElement;
  if (px === null) { racine.style.removeProperty("--sidebar"); document.body.classList.remove("menu-reduit"); }
  else {
    px = Math.round(Math.max(MENU.min, Math.min(MENU.max, px)));
    racine.style.setProperty("--sidebar", `${px}px`);
    document.body.classList.toggle("menu-reduit", px < MENU.seuil);
  }
  cancelAnimationFrame(menuRaf);
  menuRaf = requestAnimationFrame(() => etat.charts.forEach((c) => c.resize()));
  if (sauver) { try { if (px === null) localStorage.removeItem(MENU.cle); else localStorage.setItem(MENU.cle, String(px)); } catch { /* stockage indisponible */ } }
}
const largeurActuelle = () => $("#sidebar").getBoundingClientRect().width;
(() => {
  try { const v = parseInt(localStorage.getItem(MENU.cle), 10); if (v) largeurMenu(v); } catch { /* stockage indisponible */ }
  const p = $("#poignee");
  p.addEventListener("pointerdown", (e) => {
    e.preventDefault(); p.setPointerCapture(e.pointerId); document.body.classList.add("redim");
    const bouger = (ev) => largeurMenu(ev.clientX);
    const lacher = (ev) => {
      p.removeEventListener("pointermove", bouger); p.removeEventListener("pointerup", lacher); p.removeEventListener("pointercancel", lacher);
      document.body.classList.remove("redim");
      largeurMenu(ev.clientX < MENU.seuil ? MENU.min : ev.clientX, true);
    };
    p.addEventListener("pointermove", bouger); p.addEventListener("pointerup", lacher); p.addEventListener("pointercancel", lacher);
  });
  p.addEventListener("dblclick", () => largeurMenu(document.body.classList.contains("menu-reduit") ? null : MENU.min, true));
  p.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); largeurMenu(largeurActuelle() + (e.key === "ArrowRight" ? 24 : -24), true); }
    if (e.key === "Enter") largeurMenu(document.body.classList.contains("menu-reduit") ? null : MENU.min, true);
  });
})();

/* ================= Routage et demarrage ================= */
function resumeMenu() {
  const el = $("#mini-flotte");
  const t = etat.flotte.length;
  if (!el || !t) return;
  const n = (s) => etat.flotte.filter((m) => m.statut_predit === s).length;
  const lignes = [["CRITIQUE", "Critiques", "#/alertes", "crit"], ["SURVEILLANCE", "Surveillance", "#/alertes", "warn"], ["NORMAL", "Normaux", "#/flotte", "ok"]];
  el.innerHTML = `<div class="tt"><span>État de la flotte</span><b>${t} moteurs</b></div>
    <div class="barre" aria-hidden="true">${lignes.map(([s]) => `<i style="width:${n(s) / t * 100}%;background:${COUL[s]}"></i>`).join("")}</div>
    ${lignes.map(([s, lib, lien, cls]) => `<a href="${lien}"><span class="dot ${cls}"></span>${lib}<b>${n(s)}</b></a>`).join("")}`;
  el.hidden = false;
}
function allerMoteur(n) { if (n) location.hash = `#/moteur/${n}`; }
async function router() {
  const [, nom = "vue", arg] = location.hash.split("/");
  const page = PAGES[nom] ? nom : "vue";
  document.querySelectorAll(".nav a").forEach((a) => { if (a.dataset.page === page) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("#titre").textContent = PAGES[page].titre;
  $("#sous-titre").textContent = PAGES[page].sous;
  document.title = `${PAGES[page].titre} | TurboWatch`;
  document.body.classList.remove("menu-ouvert");
  clearInterval(chrono);
  libererGraphes();
  const el = $("#page");
  el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  window.scrollTo(0, 0);
  if (!etat.flotte.length) {
    el.innerHTML = etat.erreurFlotte ? `${erreurBox(etat.erreurFlotte)}<div><button class="btn" id="reessayer"><i data-lucide="rotate-cw"></i>Réessayer</button></div>` : squelettes();
    icones();
    $("#reessayer")?.addEventListener("click", charger);
    return;
  }
  await PAGES[page].rendu(el, arg ? +arg : undefined);
}
async function charger() {
  etat.erreurFlotte = null; etat.details = {}; etat.analyseFlotte = null; etat.flotte = [];
  router();
  try {
    const h = await api("/health");
    etat.health = h;
    if (h.seuils) etat.seuils = h.seuils;
    $("#s-modele").className = `dot ${h.model_loaded ? "ok" : "crit"}`;
    $("#s-rag").className = `dot ${h.rag_index_ready ? "ok" : "warn"}`;
    $("#s-llm").className = `dot ${h.assistant_mode === "llm" ? "ok" : "warn"}`;
    $("#s-llm-lib").textContent = h.assistant_mode === "llm" ? "Assistant LLM" : "Assistant extractif";
    $("#pill-llm").innerHTML = `<span class="dot ${h.assistant_mode === "llm" ? "ok" : "warn"}"></span>${h.assistant_mode === "llm" ? "LLM actif" : "Mode extractif"}`;
  } catch { $("#s-modele").className = "dot crit"; }
  try {
    etat.flotte = await api("/moteurs");
    const nb = etat.flotte.filter((m) => m.statut_predit === "CRITIQUE").length;
    resumeMenu();
    const c = $("#nb-alertes"); c.textContent = nb; c.hidden = !nb;
  } catch (e) {
    etat.flotte = [];
    etat.erreurFlotte = e.status === 503 ? "Le modèle ou les données FD001 sont absents. Lancez dvc repro puis rechargez la page." : e.message;
  }
  router();
}
window.addEventListener("hashchange", router);
$("#rafraichir").addEventListener("click", charger);
$("#menu").addEventListener("click", () => document.body.classList.toggle("menu-ouvert"));
$("#voile").addEventListener("click", () => document.body.classList.remove("menu-ouvert"));
$("#saut").addEventListener("submit", (e) => { e.preventDefault(); const v = +$("#saut-input").value; if (v) { allerMoteur(v); $("#saut-input").value = ""; } });
chargerConvs();
icones();
charger();
</script>
