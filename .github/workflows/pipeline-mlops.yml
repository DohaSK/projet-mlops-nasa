# .github/workflows/pipeline-mlops.yml
name: Pipeline MLOps

on:
  push:
    branches: [main]

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache des modeles Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests, Quality Gate ML et tests RAG (pytest)
        run: pytest -v